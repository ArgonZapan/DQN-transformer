<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantileNet Dashboard</title>

  <!-- CDN: React 19 -->
  <script crossorigin src="https://unpkg.com/react@19/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>

  <!-- CDN: Babel (in-browser JSX transform) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- CDN: Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- CDN: TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.development.js"></script>

  <!-- IBM Plex Mono font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #080910;
      color: #c5c9d6;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a2f3d; }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    code { font-family: inherit; background: #111318; padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Components (loaded as Babel scripts) -->
  <script type="text/babel" src="./components/OHLCVChart.jsx" data-presets="react"></script>
  <script type="text/babel" src="./components/BacktestSection.jsx" data-presets="react"></script>
  <script type="text/babel" src="./components/StrategySection.jsx" data-presets="react"></script>
  <script type="text/babel" src="./components/LiveSection.jsx" data-presets="react"></script>

  <!-- App shell -->
  <script type="text/babel" data-presets="react">
    const TABS = [
      { id: 'backtest',  label: 'Backtest Explorer' },
      { id: 'strategy',  label: 'Strategy Simulator' },
      { id: 'live',      label: 'Live Predictions' },
    ];

    function App() {
      const [tab, setTab]           = React.useState('backtest');
      const [bestCombo, setBestCombo] = React.useState(null);

      const tabBar = {
        display: 'flex', alignItems: 'center', gap: 0,
        borderBottom: '1px solid #1e2230', background: '#0b0c0f',
        padding: '0 20px',
      };

      const tabBtn = (id) => ({
        padding: '12px 20px',
        fontFamily: 'IBM Plex Mono, monospace',
        fontSize: 11,
        fontWeight: tab === id ? 600 : 400,
        color: tab === id ? '#e2e4ea' : '#505870',
        background: 'transparent',
        border: 'none',
        borderBottom: tab === id ? '2px solid #3b82f6' : '2px solid transparent',
        cursor: 'pointer',
        letterSpacing: '0.04em',
        textTransform: 'uppercase',
        transition: 'color 0.15s',
        marginBottom: '-1px',
      });

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
          {/* Header */}
          <div style={{ background: '#0b0c0f', borderBottom: '1px solid #1e2230', padding: '10px 20px', display: 'flex', alignItems: 'center', gap: 12 }}>
            <span style={{ fontWeight: 700, color: '#e2e4ea', fontSize: 14, letterSpacing: '0.06em' }}>
              QUANTILENET
            </span>
            <span style={{ color: '#3a3f52', fontSize: 10 }}>TFT Price Forecasting</span>
            <div style={{ marginLeft: 'auto', fontSize: 10, color: '#3a3f52' }}>
              {bestCombo && (
                <span>
                  Best: {bestCombo.symbol} {bestCombo.horizon}h {bestCombo.threshold}% &nbsp;
                  <span style={{ color: '#22c55e' }}>SQN {bestCombo.sqn}</span>
                </span>
              )}
            </div>
          </div>

          {/* Tab bar */}
          <div style={tabBar}>
            {TABS.map(t => (
              <button key={t.id} style={tabBtn(t.id)} onClick={() => setTab(t.id)}>
                {t.label}
              </button>
            ))}
          </div>

          {/* Content */}
          <div style={{ flex: 1, overflow: 'auto', padding: 20 }}>
            {tab === 'backtest' && <BacktestSection />}
            {tab === 'strategy' && <StrategySection onBestCombo={setBestCombo} />}
            {tab === 'live'     && <LiveSection bestCombo={bestCombo} />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
