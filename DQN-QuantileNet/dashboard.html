<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DQN-QuantileNet Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Core libs -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- TradingView Lightweight Charts -->
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Components -->
<script type="text/babel" src="components/OHLCVChart.jsx"></script>
<script type="text/babel" src="components/BacktestSection.jsx"></script>
<script type="text/babel" src="components/StrategySection.jsx"></script>
<script type="text/babel" src="components/LiveSection.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:    #090a0d;
    --bg-panel:   #111318;
    --bg-elevated:#16181f;
    --border:     #1e2230;
    --text-1:     #e2e4ea;
    --text-2:     #8890a4;
    --text-3:     #505870;
    --accent:     #3b82f6;
    --green:      #22c55e;
    --red:        #ef4444;
    --yellow:     #f59e0b;
    --sidebar-w:  200px;
  }

  html, body, #root {
    height: 100%;
    background: var(--bg-base);
    color: var(--text-1);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #2a2f42; }

  select, input, button { font-family: inherit; }

  .mono { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#1c68e3",
  "chartHeight": 600,
  "showVolume": true,
  "defaultInterval": "5m"
}/*EDITMODE-END*/;

// ── Sidebar Nav ──────────────────────────────────────────────────────────────
const NAV_ITEMS = [
  { id: 'backtest',  label: 'Backtest',  icon: '◈', sub: 'Explorer' },
  { id: 'strategy',  label: 'Strategy',  icon: '◆', sub: 'Simulator' },
  { id: 'live',      label: 'Live',      icon: '◉', sub: 'Predictions' },
];

function Sidebar({ active, onNav, buildInfo }) {
  return (
    <aside style={{
      width: 'var(--sidebar-w)', flexShrink: 0,
      background: '#0b0c10',
      borderRight: '1px solid var(--border)',
      display: 'flex', flexDirection: 'column',
      height: '100vh', position: 'sticky', top: 0,
    }}>
      {/* Logo */}
      <div style={{ padding: '18px 16px 14px', borderBottom: '1px solid var(--border)' }}>
        <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontWeight: 700, fontSize: 13, color: 'var(--text-1)', letterSpacing: '-0.01em' }}>
          QuantileNet
        </div>
        <div style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 9, color: 'var(--text-3)', marginTop: 3, letterSpacing: '0.1em', textTransform: 'uppercase' }}>
          DQN · Dashboard
        </div>
      </div>

      {/* Nav */}
      <nav style={{ padding: '10px 8px', flex: 1 }}>
        {NAV_ITEMS.map(item => {
          const isActive = active === item.id;
          return (
            <button key={item.id} onClick={() => onNav(item.id)} style={{
              width: '100%', display: 'flex', alignItems: 'center', gap: 10,
              padding: '9px 10px', borderRadius: 6, marginBottom: 2,
              background: isActive ? 'rgba(59,130,246,0.12)' : 'transparent',
              border: isActive ? '1px solid rgba(59,130,246,0.25)' : '1px solid transparent',
              color: isActive ? '#3b82f6' : 'var(--text-3)',
              cursor: 'pointer', textAlign: 'left', transition: 'all 0.12s',
            }}
            onMouseEnter={e => { if (!isActive) { e.currentTarget.style.background = '#13151e'; e.currentTarget.style.color = 'var(--text-2)'; } }}
            onMouseLeave={e => { if (!isActive) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--text-3)'; } }}>
              <span style={{ fontSize: 14, lineHeight: 1, width: 16, textAlign: 'center', opacity: isActive ? 1 : 0.6 }}>{item.icon}</span>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, fontFamily: 'IBM Plex Mono, monospace', lineHeight: 1.3 }}>{item.label}</div>
                <div style={{ fontSize: 9, color: isActive ? 'rgba(59,130,246,0.7)' : 'var(--text-3)', fontFamily: 'IBM Plex Mono, monospace', letterSpacing: '0.06em', textTransform: 'uppercase', marginTop: 1 }}>{item.sub}</div>
              </div>
              {isActive && <div style={{ marginLeft: 'auto', width: 4, height: 4, borderRadius: '50%', background: '#3b82f6' }} />}
            </button>
          );
        })}
      </nav>

      {/* Bottom info */}
      <div style={{ padding: '12px 14px', borderTop: '1px solid var(--border)' }}>
        <div style={{ fontSize: 9, color: 'var(--text-3)', fontFamily: 'IBM Plex Mono, monospace', lineHeight: 1.8 }}>
          <div style={{ color: '#22c55e', marginBottom: 4 }}>● live data</div>
          {buildInfo && <>
            <div>epoch {buildInfo.epoch}</div>
            <div style={{ color: '#3a3f52' }}>val {buildInfo.val}</div>
          </>}
          <div style={{ marginTop: 6, color: '#2a2f3d' }}>binance · rest api</div>
        </div>
      </div>
    </aside>
  );
}

// ── Page header ──────────────────────────────────────────────────────────────
function PageHeader({ section }) {
  const meta = {
    backtest:  { title: 'Backtest Explorer',     desc: 'Walk-forward calibration analysis · epoch 9 · 2025-10-19 → 2026-04-20' },
    strategy:  { title: 'Strategy Simulator',    desc: 'Brute-force parameter search · ranked by SQN · click row to inspect' },
    live:      { title: 'Live Predictions',      desc: 'Real-time model inference · refreshed every 3 min · fan = p10–p90 quantile range' },
  }[section];

  return (
    <div style={{ padding: '16px 24px 14px', borderBottom: '1px solid var(--border)', background: '#0b0c10', display: 'flex', alignItems: 'baseline', gap: 14, flexShrink: 0 }}>
      <h1 style={{ fontFamily: 'IBM Plex Mono, monospace', fontWeight: 700, fontSize: 15, color: 'var(--text-1)', letterSpacing: '-0.01em' }}>{meta.title}</h1>
      <span style={{ fontFamily: 'IBM Plex Mono, monospace', fontSize: 10, color: 'var(--text-3)', letterSpacing: '0.02em' }}>{meta.desc}</span>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [section, setSection] = useState('live');
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  // Tweaks panel protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const buildInfo = { epoch: 9, val: '0.1645' };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar active={section} onNav={setSection} buildInfo={buildInfo} />

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <PageHeader section={section} />
        <main style={{ flex: 1, overflow: 'auto', padding: 20 }}>
          {section === 'backtest'  && <BacktestSection />}
          {section === 'strategy' && <StrategySection />}
          {section === 'live'     && <LiveSection />}
        </main>
      </div>

      {showTweaks && (
        <TweaksPanel
          title="Tweaks"
          onClose={() => { setShowTweaks(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}
        >
          <TweakSection label="Chart">
            <TweakColor label="Accent Color" value={tweaks.accentColor}
              onChange={v => { setTweaks(t=>({...t,accentColor:v})); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{accentColor:v}},'*'); }} />
            <TweakSlider label="Chart Height" min={200} max={600} step={20} value={tweaks.chartHeight}
              onChange={v => { setTweaks(t=>({...t,chartHeight:v})); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{chartHeight:v}},'*'); }} />
            <TweakToggle label="Show Volume" value={tweaks.showVolume}
              onChange={v => { setTweaks(t=>({...t,showVolume:v})); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{showVolume:v}},'*'); }} />
          </TweakSection>
          <TweakSection label="Default">
            <TweakSelect label="Interval" value={tweaks.defaultInterval}
              options={['1m','5m','15m','1h','4h','1d']}
              onChange={v => { setTweaks(t=>({...t,defaultInterval:v})); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{defaultInterval:v}},'*'); }} />
          </TweakSection>
        </TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
