[learner]
host = "tcp://127.0.0.1"
port = 5555
metrics_port = 5556
device = "cuda"

[[actors]]
symbol = "BTCUSDT"
exchange = "binance"
leverage = 1

[[actors]]
symbol = "ETHUSDT"
exchange = "binance"
leverage = 1

[[actors]]
symbol = "SOLUSDT"
exchange = "binance"
leverage = 1

[timeframes]
candles_1m  = 15
candles_15m = 15
candles_1h  = 20
candles_1d  = 30
candles_1w  = 54

[monitoring]
host = "tcp://127.0.0.1"
port = 3001
metrics_pull_port = 3002
metrics_push_interval_sec = 5
dashboard_poll_interval_sec = 60

[training]
gamma = 0.999
lr = 0.0001
batch_size = 256
buffer_capacity = 500000
min_buffer_size = 10000
target_update_interval = 1000
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay_fraction = 0.3
dropout = 0.1
n_step = 1
seed = 42
resume_from_checkpoint = ""
keep_last_n_checkpoints = 5
checkpoint_interval = 5000
evaluation_interval = 10000
train_data_fraction = 0.8
min_episode_length = 100

[per]
alpha = 0.6
beta_start = 0.4
beta_end = 1.0
epsilon = 0.0001

[model]
num_actions = 4
n_transformer_blocks = 3
n_attention_heads = 8
key_dim = 64
ff_dim = 512
conv_kernel_size = 3
conv1d_filters = 128

[features]
num_features = 8
use_ohlcv = true
use_rsi = true
use_macd = true
use_sma20 = true

[reward]
commission_open = 0.001
commission_close = 0.001
trade_penalty = 0.001
clip_min = -1.0
clip_max = 1.0
intermediate_reward_max = 0.1
drawdown_penalty = 0.5
time_decay_hours = 1.0
confidence_scale = 1.0

[data]
source = "file"
path = "node/data/historical/"
cache_path = "node/data/cache/"
binance_rate_limit = 1000
normalization_window = 20
allow_partial_history = true
api_retry_interval_sec = 60

[logging]
level = "INFO"
max_file_size_mb = 10
max_files = 5
log_dir = "logs"

[backtesting]
enabled = false
model_path = "python/checkpoints/best_model.pt"
start_date = "2023-01-01"
end_date = "2023-12-31"
results_dir = "results"

[api]
simulation_mode = true
