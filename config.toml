[[actors]]
symbol = "BTCUSDT"
exchange = "binance"
leverage = 1

[[actors]]
symbol = "ETHUSDT"
exchange = "binance"
leverage = 1

[[actors]]
symbol = "SOLUSDT"
exchange = "binance"
leverage = 1

[learner]
host = "tcp://127.0.0.1"
port = 5555
metrics_port = 5556
device = "cuda"
num_threads = 4

[timeframes]
candles_1m = 30
candles_15m = 24
candles_1h = 48
candles_1d = 30
candles_1w = 0

[monitoring]
host = "tcp://127.0.0.1"
port = 3001
metrics_pull_port = 3002
metrics_push_interval_sec = 5
dashboard_poll_interval_sec = 60

[training]
gamma = 0.97
lr = 2.5e-5
batch_size = 256
buffer_capacity = 500000
min_buffer_size = 100000
target_update_interval = 1000
epsilon_start = 1.0
epsilon_end = 0.1
epsilon_decay_fraction = 0.5
dropout = 0.2
seed = 42
resume_from_checkpoint = ""
keep_last_n_checkpoints = 24
checkpoint_interval = 20000
evaluation_interval = 5000
validation_days = 7
validation_weeks = 0
training_months = 48
episode_length = 960
step_interval = 15
max_trades_per_episode = 1
return_mode = "nstep"
n_step = 5
compile_model = false
min_hold_steps = 5
lr_scheduler = "none"
lr_min = 1e-5
hold_bias_min = 0.3
hold_bias_max = 0.7

[per]
alpha = 0.6
beta_start = 0.4
beta_end = 1.0
epsilon = 0.0001
positive_ratio = 0.4
long_short_balance = 0.0

[model]
num_actions = 4
n_transformer_blocks = 3
n_attention_heads = 4
key_dim = 32
ff_dim = 256
conv_kernel_size = 3
conv1d_filters = 128

[features]
num_features = 8
use_ohlcv = true
use_rsi = true
use_macd = true
use_sma20 = true

[reward]
commission_open = 0.00075
commission_close = 0.00075
trade_penalty = 0.0005
close_penalty = 0.0
post_close_cooldown_steps = 12
intermediate_reward_max = 0.1
loss_scale = 1.4
hold_penalty_per_bar = 0.0002
time_decay_hours = 4.0
drawdown_penalty = 0.0
idle_penalty_per_bar = 0.0001
clip_min = -1.0
clip_max = 1.0
reward_scale = 10.0
unrealized_reward_scale = 0.1

[data]
source = "file"
path = "node/data/historical/"
cache_path = "node/data/cache/"
binance_rate_limit = 1000
normalization_window = 60
allow_partial_history = false
api_retry_interval_sec = 60

[logging]
level = "INFO"
max_file_size_mb = 10
max_files = 5
log_dir = "logs"

[backtesting]
enabled = false
model_path = "python/checkpoints/best_model.pt"
start_date = "2023-01-01"
end_date = "2023-12-31"
results_dir = "results"
step_interval = 5
max_oos_days = 30
fee = 0.00075

[report]
enabled = true
mode = "full"
every_n_updates = 5
min_interval_sec = 0

[alerts]
enabled = true
telegram_token = "8692060831:AAFkyj2rRsAnv5AKwzn_KefjJblUO-3tF68"
telegram_chat_id = "8624710090"
cooldown_sec = 300
grad_explode_threshold = 5.0
action_collapse_threshold = 0.95
loss_plateau_steps = 2000

[onnx]
enabled = true
export_path = "python/checkpoints/model.onnx"
device = "cpu"

[api]
simulation_mode = true

[tensorboard]
log_dir = "runs"
log_interval_sec = 300
histogram_interval_sec = 60
enable_actor_metrics = true
debug_interval_sec = 300
